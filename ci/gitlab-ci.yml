# Example GitLab CI job for ArchLens
archlens:
  image: python:3.12
  stage: test
  variables:
    ARCHLENS_BASE_REF: "origin/${CI_DEFAULT_BRANCH}"
  script:
    - pip install .
    - chmod +x ci/archlens-check.sh
    - ./ci/archlens-check.sh .
  artifacts:
    paths:
      - impact_report.md
      - docs/ARCHITECTURE.md
      - docs/CANONICAL_DATA_MODEL.md
      - docs/SCHEMA_CDM_DRIFT.md
      - docs/PROCESS_TRACES.md
      - docs/DOMAINS.md
      - docs/ARCHITECTURE_TIMELINE.md
    when: always
