[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archlens"
version = "0.1.0"
description = "Living architecture intelligence — scan, query, diff, and analyze impact on any codebase"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "ArchLens" }]
keywords = ["architecture", "c4-model", "impact-analysis", "living-documentation", "tree-sitter"]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-python>=0.23",
    "click>=8.0",
    "pydantic>=2.0",
    "networkx>=3.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]  # kept for backward-compatible extras installs
ai = ["mcp>=1.0,<2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
archlens = "archlens.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["archlens"]

[tool.hatch.build.targets.wheel.force-include]
"archlens/skills" = "archlens/skills"

[tool.hatch.build]
include = [
  "archlens/**",
  "archlens/queries/*.scm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]